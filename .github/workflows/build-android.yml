name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SamsungRemote-v0.1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SamsungRemote-Android
          path: dist/SamsungRemote-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
